site_name: Spark
site_author: Rudra Sarker
site_description: Lightweight Python toolkit for OSS project foundations — validate repository structure, assess project maturity, scaffold new projects, and score codebase quality.
site_url: https://rudra496.github.io/spark/
repo_url: https://github.com/rudra496/spark
repo_name: rudra496/spark
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Reference: API.md
  - Architecture: ARCHITECTURE.md
  - Internationalization: I18N.md
  - Innovation: INNOVATION.md
  - FAQ: FAQ.md
  - Showcase: SHOWCASE.md
  - Benchmarks: BENCHMARKS.md
  - Release Readiness: RELEASE_READINESS.md

plugins:
  - search
  - sitemap

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rudra496
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/rudrasarker
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/Rudra496
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@rudrasarker9732
  version:
    provider: mike
  meta:
    keywords: Spark, Python toolkit, OSS validation, repository structure, project maturity, codebase quality, project scaffolding, open source tools, Python CLI, developer tools, lint repository, project health, i18n Python, plugin system Python
