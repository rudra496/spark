<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#238636"/><stop offset="100%" stop-color="#3fb950"/></linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f6feb"/><stop offset="100%" stop-color="#58a6ff"/></linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8957e5"/><stop offset="100%" stop-color="#a371f7"/></linearGradient>
    <linearGradient id="s4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#da3633"/><stop offset="100%" stop-color="#f85149"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#484f58"/></marker>
  </defs>

  <rect width="800" height="280" rx="12" fill="url(#bg)"/>
  <text x="400" y="35" text-anchor="middle" fill="#c9d1d9" font-size="18" font-weight="700">How Spark Works</text>

  <!-- Step 1 -->
  <rect x="30" y="60" width="170" height="170" rx="10" fill="#21262d" stroke="url(#s1)" stroke-width="1.5"/>
  <circle cx="115" cy="90" r="16" fill="url(#s1)"/>
  <text x="115" y="95" text-anchor="middle" fill="white" font-size="13" font-weight="700">1</text>
  <text x="115" y="120" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="600">Scan</text>
  <text x="115" y="145" text-anchor="middle" fill="#8b949e" font-size="10">Walk directory tree</text>
  <text x="115" y="162" text-anchor="middle" fill="#8b949e" font-size="10">Detect language</text>
  <text x="115" y="179" text-anchor="middle" fill="#8b949e" font-size="10">Read metadata</text>

  <line x1="200" y1="145" x2="230" y2="145" stroke="#484f58" stroke-width="2" marker-end="url(#a)"/>

  <!-- Step 2 -->
  <rect x="230" y="60" width="170" height="170" rx="10" fill="#21262d" stroke="url(#s2)" stroke-width="1.5"/>
  <circle cx="315" cy="90" r="16" fill="url(#s2)"/>
  <text x="315" y="95" text-anchor="middle" fill="white" font-size="13" font-weight="700">2</text>
  <text x="315" y="120" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="600">Validate</text>
  <text x="315" y="145" text-anchor="middle" fill="#8b949e" font-size="10">Check required files</text>
  <text x="315" y="162" text-anchor="middle" fill="#8b949e" font-size="10">CI workflows</text>
  <text x="315" y="179" text-anchor="middle" fill="#8b949e" font-size="10">License, README</text>

  <line x1="400" y1="145" x2="430" y2="145" stroke="#484f58" stroke-width="2" marker-end="url(#a)"/>

  <!-- Step 3 -->
  <rect x="430" y="60" width="170" height="170" rx="10" fill="#21262d" stroke="url(#s3)" stroke-width="1.5"/>
  <circle cx="515" cy="90" r="16" fill="url(#s3)"/>
  <text x="515" y="95" text-anchor="middle" fill="white" font-size="13" font-weight="700">3</text>
  <text x="515" y="120" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="600">Score</text>
  <text x="515" y="145" text-anchor="middle" fill="#8b949e" font-size="10">5 categories</text>
  <text x="515" y="162" text-anchor="middle" fill="#8b949e" font-size="10">Weighted 0-100</text>
  <text x="515" y="179" text-anchor="middle" fill="#8b949e" font-size="10">Strengths &amp; gaps</text>

  <line x1="600" y1="145" x2="630" y2="145" stroke="#484f58" stroke-width="2" marker-end="url(#a)"/>

  <!-- Step 4 -->
  <rect x="630" y="60" width="140" height="170" rx="10" fill="#21262d" stroke="url(#s4)" stroke-width="1.5"/>
  <circle cx="700" cy="90" r="16" fill="url(#s4)"/>
  <text x="700" y="95" text-anchor="middle" fill="white" font-size="13" font-weight="700">4</text>
  <text x="700" y="120" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="600">Report</text>
  <text x="700" y="145" text-anchor="middle" fill="#8b949e" font-size="10">JSON output</text>
  <text x="700" y="162" text-anchor="middle" fill="#8b949e" font-size="10">Action items</text>
  <text x="700" y="179" text-anchor="middle" fill="#8b949e" font-size="10">Next steps</text>
</svg>
