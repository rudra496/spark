<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f78166"/>
      <stop offset="100%" stop-color="#ffa657"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffa657"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker>
  </defs>

  <rect width="800" height="400" rx="12" fill="url(#bg)"/>
  <text x="400" y="38" text-anchor="middle" fill="url(#accent)" font-size="18" font-weight="700">Spark Architecture</text>

  <!-- CLI Layer -->
  <rect x="250" y="60" width="300" height="45" rx="8" fill="#21262d" stroke="url(#accent)" stroke-width="1.5"/>
  <text x="400" y="87" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="600">CLI (argparse)</text>

  <!-- Arrow down -->
  <line x1="400" y1="105" x2="400" y2="135" stroke="#ffa657" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Core Module -->
  <rect x="200" y="135" width="400" height="50" rx="8" fill="#21262d" stroke="url(#green)" stroke-width="1.5"/>
  <text x="400" y="165" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="600">SparkProject (core)</text>

  <!-- Arrows down to sub-modules -->
  <line x1="280" y1="185" x2="130" y2="225" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="400" y1="185" x2="400" y2="225" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="520" y1="185" x2="670" y2="225" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- Sub-modules -->
  <rect x="30" y="225" width="200" height="45" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="130" y="245" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="600">validate()</text>
  <text x="130" y="262" text-anchor="middle" fill="#8b949e" font-size="10">Check required files</text>

  <rect x="270" y="225" width="260" height="45" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="400" y="245" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="600">assess() + discover()</text>
  <text x="400" y="262" text-anchor="middle" fill="#8b949e" font-size="10">Score 0-100 + metadata</text>

  <rect x="570" y="225" width="200" height="45" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="670" y="245" text-anchor="middle" fill="#c9d1d9" font-size="12" font-weight="600">scaffold()</text>
  <text x="670" y="262" text-anchor="middle" fill="#8b949e" font-size="10">Create spark.json</text>

  <!-- Bottom features -->
  <rect x="50" y="310" width="160" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="130" y="334" text-anchor="middle" fill="#8b949e" font-size="11">Plugin System</text>

  <rect x="240" y="310" width="160" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="320" y="334" text-anchor="middle" fill="#8b949e" font-size="11">Integration Registry</text>

  <rect x="430" y="310" width="160" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="510" y="334" text-anchor="middle" fill="#8b949e" font-size="11">i18n (en/es/fr)</text>

  <rect x="620" y="310" width="140" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="690" y="334" text-anchor="middle" fill="#8b949e" font-size="11">Zero Dependencies</text>

  <!-- Connecting lines to bottom -->
  <line x1="130" y1="270" x2="130" y2="310" stroke="#30363d" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="400" y1="270" x2="510" y2="310" stroke="#30363d" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="670" y1="270" x2="690" y2="310" stroke="#30363d" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- Tagline -->
  <text x="400" y="385" text-anchor="middle" fill="#484f58" font-size="11">Pure Python standard library — no runtime dependencies</text>
</svg>
