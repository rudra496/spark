name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-files:
    name: Validate required files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files exist and are non-empty
        run: |
          set -euo pipefail
          files=(
            README.md
            pyproject.toml
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            SUPPORT.md
            CHANGELOG.md
            ROADMAP.md
            docs/ARCHITECTURE.md
            docs/API.md
            docs/FAQ.md
            docs/SHOWCASE.md
            examples/README.md
          )
          for f in "${files[@]}"; do
            if [ ! -s "$f" ]; then
              echo "❌ Missing or empty required file: $f"
              exit 1
            fi
          done
          echo "✅ All required files are present and non-empty."

  lint-python:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff --quiet

      - name: Run ruff
        run: ruff check spark/ tests/

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e . mypy --quiet

      - name: Run mypy
        run: mypy spark/

  docs-build:
    name: Docs Build (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install docs tooling
        run: pip install mkdocs mkdocs-material --quiet

      - name: Build docs
        run: mkdocs build --strict

  dead-links:
    name: Dead Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links in docs and README
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --offline README.md docs/**/*.md

  test:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e . --quiet

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
