name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Build and deploy MkDocs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install MkDocs and plugins
        run: |
          pip install \
            mkdocs-material \
            mkdocs \
            --quiet

      - name: Configure Git for gh-pages push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build docs (strict)
        run: mkdocs build --strict

      - name: Deploy docs to GitHub Pages
        run: mkdocs gh-deploy --force --clean

      - name: Verify deployed homepage is reachable
        run: |
          for i in {1..6}; do
            if curl --fail --silent --show-error https://rudra496.github.io/spark/ > /dev/null; then
              echo "Docs homepage is reachable."
              exit 0
            fi
            echo "Retrying docs check in 10 seconds..."
            sleep 10
          done
          echo "Docs homepage did not become reachable in time."
          exit 1
