name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Verify changelog mentions tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          grep -q "${TAG}" CHANGELOG.md || {
            echo "Expected ${TAG} entry in CHANGELOG.md before release.";
            exit 1;
          }

  release:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
