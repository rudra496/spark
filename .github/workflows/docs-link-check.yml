name: Docs Homepage Check

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

jobs:
  check-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Check docs homepage
        run: |
          curl --fail --silent --show-error https://rudra496.github.io/spark/ > /dev/null
          echo "Docs homepage is reachable."
